name: Lead triage — send approved

# Stage 2: send the one intro email a human approved by replying
# "@salesbot /lead-send-approved" inside that lead's thread in #new-leads.
#
# This is the one workflow that runs with send_email permitted. Its scope is
# deliberately narrow: it does not research, does not create records, and acts
# on exactly the thread it was invoked from — never the whole channel. n8n
# routes here (instead of claude.yml) specifically when the mention's text is
# this command, so the sender permission profile is never a choice left to
# freeform prompt text.
#
# thread_ts is required: this command has no meaning without a specific
# lead's thread to act on.

on:
  workflow_dispatch:
    inputs:
      thread_ts:
        description: "Thread ts of the lead's signup post in #new-leads (required)"
        required: true
        type: string
      slack_channel:
        description: "Slack channel ID. Blank uses the SLACK_CHANNEL secret."
        required: false
        type: string
        default: ""

jobs:
  send:
    # A reusable workflow cannot request more than its caller grants, so these
    # must match the permissions claude.yml declares or the run fails at startup
    # with no log.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/claude.yml
    secrets: inherit
    with:
      prompt: "/lead-send-approved"
      slack_channel: ${{ inputs.slack_channel }}
      thread_ts: ${{ inputs.thread_ts }}
      max_turns: "60"
      timeout_minutes: 30
      # The only profile that permits send_email.
      settings_file: .github/claude/settings-sender.json
